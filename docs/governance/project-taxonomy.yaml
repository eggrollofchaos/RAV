# RAV Project Taxonomy — Schema v1
# Generated by /build-taxonomy on 2026-03-23
# Reference: docs/governance/taxonomy-reference.md (schema, vocabulary, classification rules)

version: 1

# ──────────────────────────────────────────────────────────────────────
# PROJECT — Basic metadata
# ──────────────────────────────────────────────────────────────────────
project:
  name: "RAV"
  type: "app"
  repo: "eggrollofchaos/RAV"
  description: "Agentic AI radiology prototype for chest X-ray classification, structured findings, and grounded report generation with Streamlit UI"
  entry_points:
    - "app/streamlit_app.py"
    - "scripts/train_chest_baseline.py"
    - "scripts/eval_chest_baseline.py"
    - "scripts/infer_chest_single.py"

# ──────────────────────────────────────────────────────────────────────
# DOMAINS
# ──────────────────────────────────────────────────────────────────────
domains:
  - name: "Machine Learning"
    key: "ml"
    code: "MLE"
    description: "Model architecture, training loops, checkpoint management, and multi-label chest X-ray classification"
    components:
      - name: "ModelBuilder"
        type: "library"
        description: "Backbone-agnostic model factory for DenseNet121, ResNet50, and EfficientNet-B0 with configurable dropout and pretrained weights"
        files: ["src/rav_chest/models.py"]
        tests: []
      - name: "TrainingPipeline"
        type: "script"
        description: "End-to-end training loop with multi-label BCE loss, AMP, checkpoint save/resume, and per-epoch validation metrics"
        files: ["scripts/train_chest_baseline.py"]
        tests: []
      - name: "CheXpert5TaskTrainer"
        type: "script"
        description: "Specialized training script for CheXpert 5-task mixed uncertainty policy experiments with per-class uncertainty handling"
        files: ["scripts/train_chexpert_5task_policy.py"]
        tests: []
      - name: "ImportedEvaXReference"
        type: "reference"
        description: "Sanitized EVA-X Tiny binary classifier reference lane copied from the older chest X-ray prototype for future backbone comparison"
        files:
          - "reference_pipelines/chest_xray_eva_vlm/rav_reference/eva_x.py"
          - "reference_pipelines/chest_xray_eva_vlm/rav_reference/models.py"
          - "reference_pipelines/chest_xray_eva_vlm/rav_reference/training.py"
          - "reference_pipelines/chest_xray_eva_vlm/scripts/train.py"
        tests: []
    rules: []
    reference_docs: []
    active_initiatives: ["Chest Baseline"]

  - name: "Data Management"
    key: "data"
    code: "DAT"
    description: "Dataset loading, preprocessing, augmentation transforms, train/val/test split preparation, and data sanity validation"
    components:
      - name: "ChestDataset"
        type: "library"
        description: "PyTorch Dataset for CheXpert and Kaggle POC chest X-ray data with multi-label targets, uncertain label handling, augmentation transforms, and collation"
        files: ["src/rav_chest/data.py"]
        tests: []
      - name: "CheXpertPrep"
        type: "script"
        description: "Prepare CheXpert train/val/test CSVs from raw CheXpert-v1.0-small with stratified splitting and label column mapping"
        files: ["scripts/prepare_chexpert_data.py"]
        tests: []
      - name: "PneumoniaPrep"
        type: "script"
        description: "Prepare POC Kaggle chest-xray-pneumonia binary classification CSVs from folder-based raw splits"
        files: ["scripts/poc/prepare_chest_pneumonia_data.py"]
        tests: []
      - name: "DataSanityChecker"
        type: "script"
        description: "Validates train/val/test CSVs for class balance, missing files, split leakage, and label distribution anomalies"
        files: ["scripts/check_chest_data_sanity.py"]
        tests: []
    rules: []
    reference_docs:
      - "docs/CHEST_RUNBOOK.md"
    active_initiatives: ["Chest Baseline"]

  - name: "Inference"
    key: "inference"
    code: "INF"
    description: "Model loading, single-image and batch inference pipeline, threshold application, and structured findings output"
    components:
      - name: "InferencePipeline"
        type: "service"
        description: "Loads checkpoint, builds transforms, applies per-class thresholds, and produces structured findings JSON from PIL images"
        files: ["src/rav_chest/pipeline.py"]
        tests: []
      - name: "SingleImageInference"
        type: "script"
        description: "CLI tool for running inference on a single chest X-ray image and saving the report payload JSON"
        files: ["scripts/infer_chest_single.py"]
        tests: []
    rules: []
    reference_docs: []
    active_initiatives: []

  - name: "Evaluation"
    key: "evaluation"
    code: "EVL"
    description: "Classification metrics (AUROC, F1, Brier, calibration), threshold optimization, confusion matrices, and evaluation scripts"
    components:
      - name: "MetricsLibrary"
        type: "library"
        description: "Per-class and macro AUROC, F1, Brier score, ECE calibration, confusion matrices, sigmoid, threshold optimization, and prediction thresholding"
        files: ["src/rav_chest/metrics.py"]
        tests: []
      - name: "EvalScript"
        type: "script"
        description: "Evaluate a trained checkpoint on val/test split with full metrics, confusion matrices, and JSON/CSV output"
        files: ["scripts/eval_chest_baseline.py"]
        tests: []
      - name: "CheXpert5TaskEval"
        type: "script"
        description: "Specialized evaluation script for CheXpert 5-task policy models with threshold optimization and per-class analysis"
        files: ["scripts/eval_chexpert_5task_policy.py"]
        tests: []
      - name: "TrainingMonitor"
        type: "script"
        description: "Real-time ETA estimation from metrics history.jsonl with continuous watch mode"
        files: ["scripts/monitor_training_eta.py"]
        tests: []
      - name: "ImportedJudgeReference"
        type: "reference"
        description: "Sanitized MedGemma judge and QA evaluation reference lane copied from the older chest X-ray prototype"
        files:
          - "reference_pipelines/chest_xray_eva_vlm/rav_reference/evaluation.py"
          - "reference_pipelines/chest_xray_eva_vlm/rav_reference/qa_evaluator.py"
          - "reference_pipelines/chest_xray_eva_vlm/scripts/download_test_images.py"
          - "reference_pipelines/chest_xray_eva_vlm/scripts/evaluate_radiology_assistant.py"
          - "reference_pipelines/chest_xray_eva_vlm/scripts/generate_test_json.py"
        tests: []
    rules: []
    reference_docs: []
    active_initiatives: []

  - name: "Reporting"
    key: "reporting"
    code: "RPT"
    description: "Structured findings JSON construction, template-based impression generation, and grounded report output"
    components:
      - name: "FindingsBuilder"
        type: "library"
        description: "Builds structured findings payload with confidence scores, critical flags (Pneumothorax, Pleural Effusion, Edema), and deterministic impression text from model probabilities"
        files: ["src/rav_chest/reporting.py"]
        tests: []
    rules: []
    reference_docs: []
    active_initiatives: []

  - name: "LLM Integration"
    key: "llm"
    code: "LLM"
    description: "OpenAI API wrapper for impression rewriting and agent Q&A grounded in model output context"
    components:
      - name: "LLMClient"
        type: "library"
        description: "OpenAI API client with .env key resolution, system prompts for medical writing and agent Q&A, and report impression rewrite"
        files: ["src/rav_chest/llm.py"]
        tests: []
      - name: "LLMWrapper"
        type: "script"
        description: "CLI for direct prompts, file-based prompts, and report JSON impression rewriting via OpenAI"
        files: ["scripts/llm_wrapper.py"]
        tests: []
      - name: "ImportedLocalVLMReference"
        type: "reference"
        description: "Sanitized local Llama and CheXagent backend reference lane copied from the older chest X-ray prototype"
        files:
          - "reference_pipelines/chest_xray_eva_vlm/rav_reference/llm.py"
          - "reference_pipelines/chest_xray_eva_vlm/scripts/diagnose.py"
        tests: []
    rules: []
    reference_docs: []
    active_initiatives: []

  - name: "User Interface"
    key: "ui"
    code: "GUI"
    description: "Streamlit web app for inference, metrics visualization, report display, LLM rewrite, and agent Q&A"
    components:
      - name: "StreamlitApp"
        type: "ui"
        description: "Multi-page Streamlit app with inference page (upload, predict, findings, impression, LLM rewrite), model metrics page, and Ask Agent Q&A page"
        files: ["app/streamlit_app.py"]
        tests: []
      - name: "StreamlitConfig"
        type: "config"
        description: "Streamlit theme and server configuration"
        files: [".streamlit/config.toml"]
        tests: []
    rules: []
    reference_docs: []
    active_initiatives: []

  - name: "Cloud Infrastructure"
    key: "cloud"
    code: "CLD"
    description: "GCP spot-runner adapter for GPU training on preemptible VMs with checkpoint sync, dataset transfer, and container orchestration"
    components:
      - name: "GCPEntrypoint"
        type: "daemon"
        description: "Container entrypoint with state machine, preemption watcher, CAS transitions, Discord notifications, and hook execution"
        files: ["gcp/entrypoint.sh"]
        tests: ["tests/bats/test_runner_adapter.bats"]
      - name: "RunnerCommon"
        type: "library"
        description: "Shared GCP runner bootstrap, profile initialization, env loading, and adapter library integration with gcp-spot-runner"
        files: ["scripts/gcp_runner_common.sh"]
        tests: []
      - name: "CheckpointSync"
        type: "script"
        description: "Wraps training with periodic GCS sync of checkpoints and metrics, auto-resume from last.pt on restart"
        files: ["scripts/gcp_train_with_checkpoint_sync.sh"]
        tests: []
      - name: "SubmitWrappers"
        type: "script"
        description: "Thin wrappers for submitting primary CheXpert and POC spot training runs via the runner adapter"
        files: ["scripts/gcp_submit_primary.sh", "scripts/gcp_submit_poc.sh", "scripts/gcp_submit_chexpert_experiment.sh"]
        tests: []
      - name: "RavGCPCLI"
        type: "script"
        description: "Unified operator CLI dispatching to build, submit, monitor, ops, and version subcommands"
        files: ["scripts/rav-gcp.sh"]
        tests: []
      - name: "DatasetTransfer"
        type: "script"
        description: "One-time full CheXpert download from Azure and upload to GCS, plus cache sync for training VMs"
        files: ["scripts/gcp_fetch_chexpert_full.sh", "scripts/gcp_sync_chexpert_cache.sh"]
        tests: []
      - name: "IterationRunner"
        type: "script"
        description: "Automated hyperparameter iteration loop: submits sequential spot runs across config variants until target F1 or max-runs"
        files: ["scripts/gcp_iterate_chexpert.sh", "scripts/gcp_autotune_after_current_runs.sh"]
        tests: []
      - name: "BuildAndOps"
        type: "script"
        description: "Docker image build/push, ops pass-through, monitor, and version wrappers for the runner adapter"
        files: ["scripts/gcp_build_image.sh", "scripts/gcp_ops.sh", "scripts/gcp_monitor.sh", "scripts/gcp_version.sh"]
        tests: []
      - name: "CloudReconciler"
        type: "script"
        description: "Reconciler deployment script for GCP cloud state management"
        files: ["gcp/cloud_reconciler/deploy.sh"]
        tests: []
      - name: "ContainerImage"
        type: "config"
        description: "Dockerfile for CUDA-based training container with PyTorch, gcloud CLI, and RAV source"
        files: ["gcp/Dockerfile.train", "gcp/cloudbuild.rav.yaml"]
        tests: []
      - name: "GCPConfig"
        type: "config"
        description: "Environment configuration, state transitions, and helper scripts for the spot-runner adapter"
        files: ["gcp/rav_spot.env.example", "gcp/state_transitions.json", "gcp/state_helpers.sh", "gcp/create_bucket.sh", "gcp/create_sa.sh"]
        tests: ["tests/bats/test_state_helpers_wrapper.bats", "tests/bats/test_state_transitions_parity.bats"]
    rules: []
    reference_docs:
      - "gcp/GCP_NOTES.md"
      - "gcp/GETTING_STARTED.md"
      - "gcp/DATASET_TRANSFER.md"
    active_initiatives: ["GCP Training"]

  - name: "Foundation"
    key: "foundation"
    code: "FND"
    description: "Shared utilities, configuration, versioning, experiment config YAML, and project build targets"
    components:
      - name: "Utils"
        type: "library"
        description: "Seed setting, directory creation, YAML/JSON I/O, and device selection (CUDA/MPS/CPU auto-detect)"
        files: ["src/rav_chest/utils.py"]
        tests: []
      - name: "Version"
        type: "config"
        description: "Single source of truth for app version string"
        files: ["src/rav_chest/version.py"]
        tests: ["tests/bats/test_version_parity.bats"]
      - name: "ExperimentConfigs"
        type: "config"
        description: "YAML experiment configs for primary CheXpert (baseline + variants) and POC tracks defining data paths, labels, training hyperparameters, and evaluation thresholds"
        files:
          - "configs/primary/chest_chexpert.yaml"
          - "configs/primary/chest_chexpert_5task_policy.yaml"
          - "configs/primary/chest_chexpert_u0_regularized.yaml"
          - "configs/primary/chest_chexpert_u1_regularized.yaml"
          - "configs/primary/chest_chexpert_umixed_regularized.yaml"
          - "configs/primary/chest_chexpert_umixed_regularized_posw.yaml"
          - "configs/primary/chest_chexpert_effb0_umixed_posw.yaml"
          - "configs/primary/chest_localization_extension.yaml"
          - "configs/poc/chest_pneumonia_binary.yaml"
        tests: []
      - name: "Makefile"
        type: "config"
        description: "Convenience make targets for training, evaluation, inference, sanity checks, ETA monitoring, Streamlit, and GCP operations"
        files: ["Makefile"]
        tests: []
    rules: []
    reference_docs: []
    active_initiatives: []

# ──────────────────────────────────────────────────────────────────────
# LAYERS
# ──────────────────────────────────────────────────────────────────────
layers:
  - name: "frontend"
    key: "frontend"
    description: "User-facing interfaces: Streamlit web app for inference, metrics, and agent Q&A"
    domains: ["ui"]

  - name: "backend"
    key: "backend"
    description: "Core business logic: model training, inference pipeline, metrics computation, report generation, LLM integration"
    domains: ["ml", "inference", "evaluation", "reporting", "llm"]

  - name: "data"
    key: "data"
    description: "Dataset loading, preprocessing, augmentation, split preparation, and data validation"
    domains: ["data"]

  - name: "infrastructure"
    key: "infrastructure"
    description: "GCP spot-runner adapter, Docker containers, CI/CD, deployment scripts"
    domains: ["cloud", "foundation"]

# ──────────────────────────────────────────────────────────────────────
# CONCERNS
# ──────────────────────────────────────────────────────────────────────
concerns:
  - name: "Correctness"
    key: "correctness"
    description: "Affects results, behavior, or data integrity. Wrong outputs, mislabeled data, silent fallthrough."
    domains: ["ml", "evaluation", "data", "reporting", "inference"]

  - name: "Safety"
    key: "safety"
    description: "Data loss risk, race conditions, destructive operations, auth, secrets management"
    domains: ["cloud", "llm"]

  - name: "Capability"
    key: "capability"
    description: "New feature or user-facing functionality"
    domains: []

  - name: "Performance"
    key: "performance"
    description: "Latency, throughput, resource efficiency, caching"
    domains: ["ml", "cloud"]

  - name: "Reliability"
    key: "reliability"
    description: "Error handling, circuit breakers, retry logic, graceful degradation"
    domains: ["cloud", "inference"]

  - name: "Observability"
    key: "observability"
    description: "Logging, profiling, metrics, alerting, tracing"
    domains: ["cloud", "evaluation"]

  - name: "Developer Experience"
    key: "dx"
    description: "Developer experience, documentation, tooling, code quality"
    domains: []

  - name: "Polish"
    key: "polish"
    description: "UX/visual refinement: styling, tooltips, layout, responsiveness"
    domains: ["ui"]

  - name: "Cleanup"
    key: "cleanup"
    description: "Code dedup, naming, cosmetic refactors"
    domains: []

# ──────────────────────────────────────────────────────────────────────
# WORK CLASSIFICATION
# ──────────────────────────────────────────────────────────────────────
work_classification:
  levels:
    - name: "initiative"
      description: "Strategic, cross-domain objective (quarters)"
      tracked_in: ""
    - name: "epic"
      description: "Domain-scoped deliverable (weeks)"
      tracked_in: ""
    - name: "task"
      description: "Atomic unit of work (hours-days)"
      tracked_in: "AGENTS.md"

  initiative_domains:
    "Chest Baseline": "ml"
    "GCP Training": "cloud"

# ──────────────────────────────────────────────────────────────────────
# CROSS-REFERENCES
# ──────────────────────────────────────────────────────────────────────
cross_references:
  project_registry: ""
  architecture_doc: ""
  pinned_followups: "AGENTS.md"
  rules_dir: ""
